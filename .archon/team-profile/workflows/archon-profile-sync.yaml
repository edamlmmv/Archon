name: archon-profile-sync
description: |
  Use when: A teammate wants to install the repository's safe Archon team profile into their local ~/.archon home.
  Triggers: sync archon profile, install team profile, update my archon profile.
  Does: Validates .archon/team-profile, creates a local backup, then syncs only workflows, commands, scripts, and safe config fields.
  NOT for: Copying ~/.archon wholesale, syncing secrets, or modifying runtime state.

nodes:
  - id: validate-profile
    bash: |
      set -euo pipefail
      bun run cli --cwd "$PWD" profile validate .archon/team-profile

  - id: sync-profile
    bash: |
      set -euo pipefail
      bun run cli --cwd "$PWD" profile sync .archon/team-profile
    depends_on: [validate-profile]
